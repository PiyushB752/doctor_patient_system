<!DOCTYPE html>
<html>
<head>
  <title>Doctor Onboarding</title>
</head>
<body>

  <h2>Doctor Profile Completion</h2>

  <form id="doctorForm">
    <label>Specialization:</label><br>
    <input name="specialization" required><br><br>

    <label>Experience (years):</label><br>
    <input type="number" name="experience" required><br><br>

    <label>Consultation Fee:</label><br>
    <input type="number" name="consultation_fee" required><br><br>

    <label>Profile Description:</label><br>
    <textarea name="profile_description"></textarea><br><br>

    <button type="submit">Save Profile</button>
  </form>

  <script>
    const backendUrl = "http://localhost:3000";
    const params = new URLSearchParams(window.location.search);
    const tokenFromUrl = params.get("token");

    if (tokenFromUrl) {
      localStorage.setItem("token", tokenFromUrl);
      window.history.replaceState({}, document.title, "/doctor.html");
    }

    const token = localStorage.getItem("token");

    if (!token) {
      alert("Unauthorized! Please login.");
      window.location.href = "index.html";
    }

    document.getElementById("doctorForm").onsubmit = async (e) => {
      e.preventDefault();

      const formData = Object.fromEntries(new FormData(e.target));

      const response = await fetch(
        backendUrl + "/doctor/complete-profile",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify(formData),
        }
      );

      if (!response.ok) {
        alert("Error saving profile");
        return;
      }

      alert("Doctor Profile Completed ✅");
      window.location.href = "index.html";
    };
  </script>

</body>
</html>
