<!DOCTYPE html>
<html>
<head>
    <title>Doctor Dashboard</title>
</head>
<body>
    <h2>Doctor Complete Profile</h2>

    <input type="text" id="specialization" placeholder="Specialization">
    <button onclick="completeProfile()">Submit</button>

    <script>
        const API_BASE = "https://doctorpatientsystem-production-75a3.up.railway.app";

        async function completeProfile() {
            const token = localStorage.getItem("token");

            const res = await fetch(API_BASE + "/doctor/complete-profile", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    specialization: document.getElementById("specialization").value
                })
            });

            const data = await res.json();
            alert(JSON.stringify(data));
        }
    </script>
</body>
</html>
