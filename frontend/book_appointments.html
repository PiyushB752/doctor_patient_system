<!DOCTYPE html>
<html>
<head>
  <title>Doctor Appointment System</title>
</head>
<body>

<h2>Doctor Appointment System</h2>

<h3>Load Slots</h3>

<label>Doctor ID:</label>
<input type="number" id="doctorId" />
<br><br>

<label>Patient ID:</label>
<input type="number" id="patientId" />
<br><br>

<label>Date:</label>
<input type="date" id="date" />
<br><br>

<button onclick="loadSlots()">Load Slots</button>

<h3 id="slotModeTitle">Available Slots</h3>
<div id="slots"></div>

<hr>

<h3>View Appointments (Doctor)</h3>

<label>Doctor ID:</label>
<input type="number" id="viewDoctorId" />
<button onclick="loadAppointments()">Load Appointments</button>

<div id="appointments"></div>

<script>
const API_BASE = "http://localhost:3000";

let isRescheduleMode = false;
let rescheduleAppointmentId = null;

async function loadSlots() {
  const doctorId = document.getElementById("doctorId").value;
  const date = document.getElementById("date").value;

  if (!doctorId || !date) {
    alert("Doctor ID and Date required");
    return;
  }

  const res = await fetch(
    `${API_BASE}/slots?doctor_id=${doctorId}&date=${date}`
  );

  const data = await res.json();
  const container = document.getElementById("slots");
  container.innerHTML = "";

  if (data.length === 0) {
    container.innerHTML = "<p>No slots available</p>";
    return;
  }

  data.forEach(slot => {
    const btn = document.createElement("button");
    btn.innerText =
      `${slot.start_time} - ${slot.end_time} | Capacity: ${slot.remaining_capacity}`;

    btn.onclick = () => handleSlotClick(slot.start_time);

    container.appendChild(btn);
    container.appendChild(document.createElement("br"));
    container.appendChild(document.createElement("br"));
  });
}

function handleSlotClick(time) {
  if (isRescheduleMode) {
    confirmReschedule(time);
  } else {
    bookAppointment(time);
  }
}

async function bookAppointment(time) {
  const doctorId = document.getElementById("doctorId").value;
  const patientId = document.getElementById("patientId").value;
  const date = document.getElementById("date").value;

  if (!patientId) {
    alert("Patient ID required");
    return;
  }

  const res = await fetch(`${API_BASE}/appointments`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      doctor_id: Number(doctorId),
      patient_id: Number(patientId),
      appointment_date: date,
      appointment_time: time
    })
  });

  const data = await res.json();

  if (res.ok) {
    alert("Appointment booked!");
    loadSlots();
  } else {
    alert(data.message || "Booking failed");
  }
}

async function loadAppointments() {
  const doctorId = document.getElementById("viewDoctorId").value;

  if (!doctorId) {
    alert("Doctor ID required");
    return;
  }

  const res = await fetch(
    `${API_BASE}/appointments?doctor_id=${doctorId}`
  );

  const data = await res.json();
  const container = document.getElementById("appointments");
  container.innerHTML = "";

  if (!Array.isArray(data) || data.length === 0) {
    container.innerHTML = "<p>No appointments found</p>";
    return;
  }

  data.forEach(app => {
    const div = document.createElement("div");

    div.innerHTML = `
      <b>ID:</b> ${app.appointment_id} |
      <b>Date:</b> ${app.appointment_date} |
      <b>Time:</b> ${app.appointment_time} |
      <b>Status:</b> ${app.status}
      <br><br>
    `;

    if (app.status === "booked") {
      const cancelBtn = document.createElement("button");
      cancelBtn.innerText = "Cancel";
      cancelBtn.onclick = () => cancelAppointment(app.appointment_id);
      div.appendChild(cancelBtn);

      const rescheduleBtn = document.createElement("button");
      rescheduleBtn.innerText = "Reschedule";
      rescheduleBtn.onclick = () =>
        startReschedule(app);
      div.appendChild(rescheduleBtn);
    }

    container.appendChild(div);
    container.appendChild(document.createElement("hr"));
  });
}

function startReschedule(app) {
  isRescheduleMode = true;
  rescheduleAppointmentId = app.appointment_id;

  document.getElementById("doctorId").value = app.doctor_id;
  document.getElementById("patientId").value = app.patient_id;
  document.getElementById("date").value = app.appointment_date;

  document.getElementById("slotModeTitle").innerText =
    "Select New Slot For Reschedule";

  alert("Now select new date and load slots to reschedule.");
}

async function confirmReschedule(time) {
  const date = document.getElementById("date").value;

  const res = await fetch(
    `${API_BASE}/appointments/${rescheduleAppointmentId}/reschedule`,
    {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        appointment_date: date,
        appointment_time: time
      })
    }
  );

  const data = await res.json();

  if (res.ok) {
    alert("Rescheduled successfully");

    isRescheduleMode = false;
    rescheduleAppointmentId = null;
    document.getElementById("slotModeTitle").innerText = "Available Slots";

    loadAppointments();
    loadSlots();
  } else {
    alert(data.message || "Reschedule failed");
  }
}

async function cancelAppointment(id) {
  const res = await fetch(
    `${API_BASE}/appointments/${id}/cancel`,
    { method: "PATCH" }
  );

  const data = await res.json();

  if (res.ok) {
    alert("Cancelled successfully");
    loadAppointments();
  } else {
    alert(data.message || "Cancel failed");
  }
}
</script>

</body>
</html>
