<!DOCTYPE html>
<html>
<head>
    <title>Doctor Patient System</title>
</head>
<body>
    <h1>Doctor Patient System</h1>

    <button onclick="login('doctor')">Login as Doctor</button>
    <button onclick="login('patient')">Login as Patient</button>

    <script>
        const backendUrl = "https://doctorpatientsystem-production-75a3.up.railway.app";

        function login(role) {
            window.location.href = backendUrl + "/auth/google?role=" + role;
        }

        // Save token after redirect
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (token) {
            localStorage.setItem("token", token);
            alert("Login successful!");
            window.location.href = "doctor.html";
        }
    </script>
</body>
</html>
