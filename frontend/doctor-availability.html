<!DOCTYPE html>
<html>
<head>
  <title>Doctor Availability</title>
</head>
<body>
  <h2>Add Doctor Availability</h2>

  <form id="availabilityForm">

    <label>Doctor ID:</label>
    <input type="number" id="doctor_id" required /><br /><br />

    <label>Day of Week (0-6):</label>
    <input type="number" id="day_of_week" min="0" max="6" /><br /><br />

    <label>Availability Date:</label>
    <input type="date" id="availability_date" /><br /><br />

    <label>Start Time:</label>
    <input type="time" id="start_time" required /><br /><br />

    <label>End Time:</label>
    <input type="time" id="end_time" required /><br /><br />

    <label>Capacity:</label>
    <input type="number" id="capacity" /><br /><br />

    <label>Duration (minutes):</label>
    <input type="number" id="duration" /><br /><br />

    <label>Availability Type:</label>
    <select id="availability_type" required>
      <option value="custom">Custom</option>
      <option value="stream">Stream</option>
      <option value="wave">Wave</option>
    </select><br /><br />

    <button type="submit">Create Availability</button>
  </form>

  <h3 id="response"></h3>

  <script>
    document.getElementById("availabilityForm").onsubmit = async function(e) {
      e.preventDefault();

      const token = localStorage.getItem("token");

      const data = {
        doctor_id: Number(document.getElementById("doctor_id").value),

        day_of_week: document.getElementById("day_of_week").value
          ? Number(document.getElementById("day_of_week").value)
          : null,

        availability_date: document.getElementById("availability_date").value || null,

        start_time: document.getElementById("start_time").value,
        end_time: document.getElementById("end_time").value,

        capacity: document.getElementById("capacity").value
          ? Number(document.getElementById("capacity").value)
          : null,

        duration: document.getElementById("duration").value
          ? Number(document.getElementById("duration").value)
          : null,

        availability_type: document.getElementById("availability_type").value
      };

      try {
        const response = await fetch("http://localhost:3000/doctor_availability", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Error occurred");
        }

        document.getElementById("response").innerText =
          "✅ Availability Created Successfully!";
      } catch (error) {
        document.getElementById("response").innerText =
          "❌ " + error.message;
      }
    };
  </script>

</body>
</html>
